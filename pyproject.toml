[project]
name = "ai-chat-assistant"
version = "0.3.0"
description = "AI Chat Assistant di terminal berbasis data sendiri (gratis dengan Groq / Ollama)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "groq>=0.11.0",
    "ollama>=0.4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
